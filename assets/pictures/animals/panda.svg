<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <!-- 貓熊：本專案自製手繪，仿 Kenney Animal Pack Redux 的圓臉平塗風格（原 Kenney 版耳朵在兩側、眼圈太小，看起來不像貓熊） -->
  <rect width="400" height="400" fill="#C9E6D4"/>
  <rect x="10" y="10" width="380" height="380" rx="40" fill="#E6F6EC"/>
  <!-- 耳朵：頭頂斜上方兩顆黑圓，先畫好讓頭蓋住下半 -->
  <circle cx="98" cy="108" r="54" fill="#3A3A3A" stroke="#262626" stroke-width="9"/>
  <circle cx="302" cy="108" r="54" fill="#3A3A3A" stroke="#262626" stroke-width="9"/>
  <circle cx="102" cy="112" r="26" fill="#555555"/>
  <circle cx="298" cy="112" r="26" fill="#555555"/>
  <!-- 頭 -->
  <circle cx="200" cy="215" r="145" fill="#FFFFFF" stroke="#8A8A8A" stroke-width="9"/>
  <path fill="#EFEFEF" d="M90 300 Q200 250 310 300 Q268 355 200 355 Q132 355 90 300 Z"/>
  <!-- 眼圈：往外下方斜的黑色水滴 -->
  <ellipse cx="138" cy="210" rx="38" ry="54" fill="#3A3A3A" transform="rotate(35 138 210)"/>
  <ellipse cx="262" cy="210" rx="38" ry="54" fill="#3A3A3A" transform="rotate(-35 262 210)"/>
  <!-- 眼睛 -->
  <circle cx="146" cy="200" r="18" fill="#FFFFFF"/>
  <circle cx="254" cy="200" r="18" fill="#FFFFFF"/>
  <circle cx="148" cy="202" r="10" fill="#222222"/>
  <circle cx="252" cy="202" r="10" fill="#222222"/>
  <circle cx="152" cy="197" r="4" fill="#FFFFFF"/>
  <circle cx="256" cy="197" r="4" fill="#FFFFFF"/>
  <!-- 嘴邊白毛與鼻子、嘴巴 -->
  <ellipse cx="200" cy="278" rx="48" ry="34" fill="#F7F7F7"/>
  <path fill="#333333" d="M184 256 Q200 250 216 256 Q218 262 208 270 Q200 276 192 270 Q182 262 184 256 Z"/>
  <path fill="none" stroke="#333333" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M200 274 V286 M180 288 Q190 300 200 286 Q210 300 220 288"/>
</svg>

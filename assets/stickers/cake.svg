<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="#3a3a3a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <!-- 生日蛋糕（手繪，透明底）。兩層、白色垂滴奶油、一支點著的蠟燭、盤子。
       蠟燭是「蛋糕 vs 一塊磚」最有效的辨識線索，所以做得高又亮；
       垂滴奶油的波浪邊則是「蛋糕 vs 盒子」的線索。 -->

  <!-- 盤子 -->
  <ellipse cx="200" cy="346" rx="164" ry="24" fill="#DCD9EC"/>

  <!-- 下層：海綿蛋糕 -->
  <rect x="62" y="248" width="276" height="90" rx="14" fill="#FFD9A0"/>
  <!-- 下層的垂滴奶油 -->
  <path fill="#FFFFFF" d="M62,262 v-18 a14,14 0 0 1 14,-14 h248 a14,14 0 0 1 14,14 v18
        c-12,0 -12,22 -24,22 c-12,0 -12,-22 -24,-22 c-12,0 -12,22 -24,22 c-12,0 -12,-22 -24,-22
        c-12,0 -12,22 -24,22 c-12,0 -12,-22 -24,-22 c-12,0 -12,22 -24,22 c-12,0 -12,-22 -24,-22
        c-12,0 -12,22 -24,22 c-12,0 -12,-22 -24,-22 c-12,0 -12,22 -24,22 c-12,0 -12,-22 -22,-22 Z"/>

  <!-- 上層：粉紅蛋糕 -->
  <rect x="112" y="168" width="176" height="76" rx="12" fill="#FFC2DD"/>
  <!-- 上層的垂滴奶油 -->
  <path fill="#FFFFFF" d="M112,182 v-14 a12,12 0 0 1 12,-12 h152 a12,12 0 0 1 12,12 v14
        c-11,0 -11,20 -22,20 c-11,0 -11,-20 -22,-20 c-11,0 -11,20 -22,20 c-11,0 -11,-20 -22,-20
        c-11,0 -11,20 -22,20 c-11,0 -11,-20 -22,-20 c-11,0 -11,20 -22,20 c-11,0 -11,-20 -22,-20 Z"/>

  <!-- 蠟燭：紅白斜條 -->
  <rect x="188" y="86" width="24" height="76" rx="8" fill="#FF6B6B"/>
  <g stroke="#FFFFFF" stroke-width="7" stroke-linecap="butt">
    <path d="M188,106 L212,96"/>
    <path d="M188,132 L212,122"/>
    <path d="M188,156 L212,146"/>
  </g>
  <!-- 燭芯與火焰 -->
  <path stroke-width="5" d="M200,86 V74"/>
  <path fill="#FFD93D" d="M200,26 C216,44 222,56 218,66 C214,76 208,80 200,80 C192,80 186,76 182,66 C178,56 184,44 200,26 Z"/>
  <path fill="#FF9F43" stroke="none" d="M200,48 C208,58 210,64 208,68 C206,73 203,75 200,75 C197,75 194,73 192,68 C190,64 192,58 200,48 Z"/>

  <!-- 下層的小櫻桃裝飾 -->
  <g fill="#E8455E">
    <circle cx="110" cy="300" r="15"/>
    <circle cx="200" cy="308" r="15"/>
    <circle cx="290" cy="300" r="15"/>
  </g>
</svg>

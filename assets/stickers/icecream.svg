<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg"
     fill="none" stroke="#3a3a3a" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
  <!-- 冰淇淋甜筒（手繪，透明底）。下面是有格紋的餅乾甜筒，上面兩球（薄荷綠 + 粉紅），頂上一顆櫻桃。
       兩球用 union 技法（加粗深灰墊底再填色）畫成有波浪邊的一整球，
       波浪邊是「冰淇淋球」跟「皮球」最主要的差別，不能省。 -->

  <!-- 甜筒 -->
  <path fill="#E3A857" d="M138,236 L262,236 L212,352 C208,362 200,366 194,352 Z"/>
  <path stroke="#B57F33" stroke-width="5"
        d="M160,262 L196,344 M196,262 L214,304 M232,262 L206,322 M148,286 L246,286 M162,314 L228,314"/>

  <!-- 下面那球：粉紅 -->
  <g stroke="#3a3a3a" stroke-width="12" fill="#3a3a3a">
    <circle cx="200" cy="196" r="62"/>
    <circle cx="146" cy="216" r="34"/>
    <circle cx="254" cy="216" r="34"/>
    <circle cx="172" cy="238" r="28"/>
    <circle cx="228" cy="238" r="28"/>
  </g>
  <g fill="#FF9EC4" stroke="none">
    <circle cx="200" cy="196" r="62"/>
    <circle cx="146" cy="216" r="34"/>
    <circle cx="254" cy="216" r="34"/>
    <circle cx="172" cy="238" r="28"/>
    <circle cx="228" cy="238" r="28"/>
  </g>

  <!-- 上面那球：薄荷綠 -->
  <g stroke="#3a3a3a" stroke-width="12" fill="#3a3a3a">
    <circle cx="200" cy="120" r="54"/>
    <circle cx="156" cy="140" r="30"/>
    <circle cx="244" cy="140" r="30"/>
    <circle cx="200" cy="164" r="30"/>
  </g>
  <g fill="#7FE3D0" stroke="none">
    <circle cx="200" cy="120" r="54"/>
    <circle cx="156" cy="140" r="30"/>
    <circle cx="244" cy="140" r="30"/>
    <circle cx="200" cy="164" r="30"/>
  </g>
  <!-- 巧克力碎片，讓上面那球一看就知道是冰淇淋不是氣球 -->
  <g fill="#5D3A1F" stroke="none">
    <ellipse cx="176" cy="106" rx="9" ry="6" transform="rotate(-20 176 106)"/>
    <ellipse cx="222" cy="120" rx="9" ry="6" transform="rotate(25 222 120)"/>
    <ellipse cx="196" cy="144" rx="9" ry="6" transform="rotate(-8 196 144)"/>
  </g>

  <!-- 櫻桃 -->
  <path stroke="#3E7D3E" stroke-width="6" d="M200,54 C206,40 216,32 230,30"/>
  <circle cx="200" cy="66" r="24" fill="#E8455E"/>
  <ellipse cx="192" cy="58" rx="6.5" ry="4.5" fill="#FFFFFF" stroke="none" opacity="0.85" transform="rotate(-30 192 58)"/>
</svg>

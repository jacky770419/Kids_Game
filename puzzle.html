<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>拼圖 - 小小遊樂園</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/puzzle.css">
</head>
<body class="puzzle">

<!-- 每一頁左上都一樣：回家（要按住）、上一層、小熊泡泡 -->
<header class="top">
  <div class="nav">
    <a href="index.html" class="btn xl home-hold" aria-label="回首頁（按住）"><i data-ic="home"></i></a>
    <button id="backBtn" type="button" class="btn xl" aria-label="回去選圖" hidden><i data-ic="back"></i></button>
  </div>
  <div id="guide" class="guide" data-guide="選ㄒㄩㄢˇ 喜ㄒㄧˇ 歡ㄏㄨㄢ 的˙ㄉㄜ 圖ㄊㄨˊ"></div>
</header>

<main id="selectScreen">
  <div class="pick-scroll">
    <div id="picGrid" class="pic-grid"></div>
  </div>
  <!-- 要拼幾片：格子圖＋數字，她認得數字，不用讀「2×2」。放右邊（盒子的位置）。 -->
  <aside id="diffRow" class="box levels" aria-label="要拼幾片">
    <button type="button" class="btn lv diff-btn selected" data-n="2" aria-label="2 乘 2，最簡單"><span class="lv-grid" style="--n:2"></span><span class="lv-n">2</span></button>
    <button type="button" class="btn lv diff-btn" data-n="3" aria-label="3 乘 3"><span class="lv-grid" style="--n:3"></span><span class="lv-n">3</span></button>
    <button type="button" class="btn lv diff-btn" data-n="4" aria-label="4 乘 4"><span class="lv-grid" style="--n:4"></span><span class="lv-n">4</span></button>
    <button type="button" class="btn lv diff-btn" data-n="5" aria-label="5 乘 5"><span class="lv-grid" style="--n:5"></span><span class="lv-n">5</span></button>
    <button type="button" class="btn lv diff-btn" data-n="6" aria-label="6 乘 6，最難"><span class="lv-grid" style="--n:6"></span><span class="lv-n">6</span></button>
  </aside>
</main>

<main id="gameScreen" hidden>
  <div id="tray" aria-hidden="true"></div>
  <div id="board"></div>
</main>

<canvas id="confettiCanvas"></canvas>

<!-- 完成畫面：她拼好的圖是主角；兩個選擇都是圖示（再玩一次、換一張） -->
<div id="winOverlay" class="done" hidden>
  <div class="done-art">
    <span class="done-pic"><img id="winPic" alt="拼好的圖"></span>
    <img class="done-bear" src="assets/stickers/bear.png" alt="">
  </div>
  <div class="done-side">
    <div class="done-title" data-zy="好ㄏㄠˇ 棒ㄅㄤˋ"></div>
    <div class="done-row">
      <button id="againBtn" type="button" class="btn" aria-label="再玩一次"><i data-ic="replay"></i></button>
      <button id="newPicBtn" type="button" class="btn go" aria-label="換一張圖"><i data-ic="grid"></i></button>
    </div>
  </div>
</div>

<script src="js/kiosk.js"></script>
<script src="js/sound.js"></script>
<script src="js/speech.js"></script>
<script src="js/music.js"></script>
<script src="js/ui.js"></script>
<script src="js/pictures-data.js"></script>
<script src="js/puzzle-geom.js"></script>
<script src="js/puzzle.js"></script>
<script>
/* 註冊 service worker：離線可玩全靠它。失敗（不支援、file:// 開啟、
   權限被擋）就靜默略過，網頁照常運作，只是沒有離線能力。 */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

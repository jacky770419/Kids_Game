<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>貼紙 - 小小遊樂園</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="stickers">

<header class="bar">
  <a href="index.html" class="icon-btn home-hold" title="長按回首頁">🏠</a>
  <button id="backBtn" class="icon-btn" hidden title="換一張背景">🔙</button>
  <span class="spacer"></span>
  <!-- 工具都在右側：左手扶著平板時不會被手掌壓到，也不放在畫面下緣（手腕誤觸） -->
  <button id="undoBtn" class="icon-btn" hidden title="收回上一張貼紙">↩️</button>
  <button id="clearBtn" class="icon-btn" hidden title="全部收起來">🗑️</button>
  <button id="saveBtn" class="icon-btn" hidden title="存成圖片">📷</button>
  <button id="musicBtn" class="icon-btn" title="背景音樂">🎵</button>
</header>

<main id="selectScreen">
  <div class="select-hint">選一個地方，開始貼貼紙吧！</div>
  <div id="bgGrid" class="pic-grid"></div>
</main>

<main id="gameScreen" hidden>
  <!-- 板面固定 4:3，跟背景 SVG 的 800×600 一致，貼紙的比例座標才對得上 -->
  <div id="boardWrap">
    <div id="board">
      <img id="boardBg" alt="" draggable="false">
      <div id="stickerLayer"></div>
    </div>
  </div>
  <!-- 貼紙匣：直向也留在右側，不搬到底部（下緣是手腕會壓到的地方） -->
  <aside id="tray">
    <div id="catTabs" class="cat-tabs"></div>
    <div id="trayScroll"></div>
  </aside>
</main>

<!-- 跟著手指走的浮動貼紙（從匣子拖出來時才出現） -->
<img id="ghost" alt="" draggable="false" hidden>

<div id="saveOverlay" class="overlay" hidden>
  <img id="saveImg" alt="貼紙作品">
  <div class="save-hint">長按圖片就可以存到相簿囉！</div>
  <button id="closeSave" class="big-btn alt">關閉</button>
</div>

<script src="js/kiosk.js"></script>
<script src="js/sound.js"></script>
<script src="js/speech.js"></script>
<script src="js/music.js"></script>
<script src="js/storage.js"></script>
<script src="js/stickers-data.js"></script>
<script src="js/stickers-state.js"></script>
<script src="js/stickers.js"></script>
<script>
/* 註冊 service worker：離線可玩全靠它。失敗（不支援、file:// 開啟、
   權限被擋）就靜默略過，網頁照常運作，只是沒有離線能力。 */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小小遊樂園">
<title>小小遊樂園</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/home.css">
</head>
<body class="home">

<!-- 背景：天空、雲、草地，都是平的（不能按） -->
<div class="scene" aria-hidden="true">
  <span class="cloud c1"></span>
  <span class="cloud c2"></span>
  <span class="grass"></span>
</div>

<header class="top">
  <!-- 小熊把「現在要做什麼」唸出來，點泡泡再聽一次 -->
  <div class="guide" data-guide="今ㄐㄧㄣ 天ㄊㄧㄢ 玩ㄨㄢˊ 什ㄕㄣˊ 麼˙ㄇㄜ"></div>
  <span class="spacer"></span>
  <!-- 大人的東西（音樂、唸英文、語言、版本）都收在這顆鎖後面，要按住兩秒 -->
  <button id="parentBtn" type="button" class="adult" aria-label="大人專區（按住兩秒）"><i data-ic="lock"></i>大人</button>
</header>

<!-- 六個門：位置跟舊版一樣（拼圖、著色、單字／貼紙、甜點店、故事書），她不用重新認。
     門上直接放那個遊戲裡的東西，不用讀字也知道是什麼。 -->
<main class="doors">
  <a class="door d-puzzle" href="puzzle.html" aria-label="拼圖">
    <span class="win"><img src="assets/puzzle/rabbit.jpg" alt=""></span>
    <span class="name" data-zy="拼ㄆㄧㄣ 圖ㄊㄨˊ"></span>
  </a>
  <a class="door d-coloring" href="coloring.html" aria-label="著色">
    <span class="win paper">
      <img class="fit" src="assets/lineart/panda-bamboo.png" alt="">
      <span class="dabs"><b style="background:#FF5C5C"></b><b style="background:#FFD84D"></b><b style="background:#4AA8EE"></b></span>
    </span>
    <span class="name" data-zy="著ㄓㄨㄛˊ 色ㄙㄜˋ"></span>
  </a>
  <a class="door d-words" href="words.html" aria-label="單字">
    <span class="win">
      <img class="fit" src="assets/pictures/animals/duck.png" alt="">
      <span class="tag">duck</span>
    </span>
    <span class="name" data-zy="單ㄉㄢ 字ㄗˋ"></span>
  </a>
  <a class="door d-stickers" href="stickers.html" aria-label="貼紙">
    <span class="win">
      <img class="st s1" src="assets/stickers/unicorn.png" alt="">
      <img class="st s2" src="assets/stickers/rainbow.svg" alt="">
      <img class="st s3" src="assets/stickers/princess.png" alt="">
    </span>
    <span class="name" data-zy="貼ㄊㄧㄝ 紙ㄓˇ"></span>
  </a>
  <a class="door d-cake" href="cake.html" aria-label="甜點店">
    <span class="win">
      <img class="st k1" src="assets/stickers/cake.svg" alt="">
      <img class="st k2" src="assets/stickers/cupcake.svg" alt="">
      <img class="st k3" src="assets/stickers/donut.svg" alt="">
    </span>
    <span class="name" data-zy="甜ㄊㄧㄢˊ 點ㄉㄧㄢˇ 店ㄉㄧㄢˋ"></span>
  </a>
  <a class="door d-story" href="story.html" aria-label="故事書">
    <span class="win">
      <img src="assets/story/bg/meadow.jpg" alt="">
      <img class="st t1" src="assets/story/chars/tortoise-cheer.png" alt="">
      <img class="st t2" src="assets/story/chars/hare-run.png" alt="">
    </span>
    <span class="name" data-zy="故ㄍㄨˋ 事ㄕˋ 書ㄕㄨ"></span>
  </a>
</main>

<!-- 大人專區：按鈕故意做平的，跟小孩按的「浮起來」分開 -->
<div id="parentSheet" class="parent" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="parentTitle">
    <div class="sheet-head">
      <div class="t">
        <h1 id="parentTitle">大人專區</h1>
        <span>首頁右上角的鎖要按住兩秒才會打開，小孩點一下不會進來。</span>
      </div>
      <button id="parentClose" type="button" class="adult" aria-label="關閉"><i data-ic="close"></i></button>
    </div>

    <div class="row">
      <label class="t" for="pMusic"><b>背景音樂</b><span>三首歌輪流播，故事書那一頁不會播。</span></label>
      <input class="sw" id="pMusic" type="checkbox">
    </div>
    <div class="row">
      <label class="t" for="pSpeech"><b>自動唸英文</b><span>選顏色、拼完、貼貼紙時唸出英文。她自己按喇叭一樣會唸。</span></label>
      <input class="sw" id="pSpeech" type="checkbox">
    </div>
    <div class="row">
      <div class="t"><b>故事語言</b><span>中文是注音字幕，英文是一個字一格。</span></div>
      <div class="seg" role="group" aria-label="故事語言">
        <input type="radio" name="pLang" id="pLangZh" value="zh"><label for="pLangZh">中文</label>
        <input type="radio" name="pLang" id="pLangEn" value="en"><label for="pLangEn">English</label>
      </div>
    </div>
    <div class="row">
      <div class="t"><b>單字卡的字</b><span>小寫比較像書上的字，先學小寫。</span></div>
      <div class="seg en" role="group" aria-label="單字卡的字">
        <input type="radio" name="pCase" id="pCaseLo" value="lower"><label for="pCaseLo">abc</label>
        <input type="radio" name="pCase" id="pCaseUp" value="upper"><label for="pCaseUp">ABC</label>
      </div>
    </div>
    <div class="row">
      <label class="t" for="pListen"><b>單字只聽不看字</b><span>字卡藏起來，只留喇叭。</span></label>
      <input class="sw" id="pListen" type="checkbox">
    </div>
    <div class="row">
      <label class="t" for="pCakeListen"><b>甜點店點餐只聽不看圖</b><span>客人要什麼用聽的，做對才把圖翻出來。</span></label>
      <input class="sw" id="pCakeListen" type="checkbox">
    </div>
    <div class="row">
      <div class="t">
        <b>版本 <span id="ver" class="ver"></span></b>
        <span>下載新版時請停在首頁等它跑完，中斷了下次打開會接著抓。</span>
      </div>
      <div class="bar" id="verBarWrap" hidden>
        <div class="track" role="progressbar" aria-label="新版下載進度" aria-valuemin="0" aria-valuemax="100"><div id="verBar"></div></div>
        <span id="verPct" class="pct"></span>
      </div>
    </div>
  </div>
</div>

<script src="js/kiosk.js"></script>
<script src="js/speech.js"></script>
<script src="js/music.js"></script>
<script src="js/ui.js"></script>
<script src="js/home.js"></script>
<script>
/* 註冊 service worker：離線可玩全靠它。失敗（不支援、file:// 開啟、
   權限被擋）就靜默略過，網頁照常運作，只是沒有離線能力。 */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  /* 升版後自動換新：sw.js 有 skipWaiting＋clients.claim，新版一裝好就接管，
     但「已經開著的頁面」跑的仍是舊 JS——加入主畫面的 App 不會被關掉，
     結果 iPad 上永遠是舊版（2026-09-03 實機：新加的三處唸英文全部沒聲，重開 App 才好）。
     所以新版 SW 一接管就把首頁重載一次拿新檔。只在首頁做：著色畫到一半被重載會很糟，
     而每次進遊戲都會經過首頁，在這裡換就夠了。sessionStorage 旗標防止連續重載。 */
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    try {
      if (sessionStorage.getItem('swReloaded') === '1') return;
      sessionStorage.setItem('swReloaded', '1');
    } catch (e) { /* 沒有 sessionStorage 也照樣重載一次 */ }
    location.reload();
  });
}
/* 版本號（現在收在大人專區裡）：顯示「正在用的」SW 版本（問 SW 本人，不看 cache 名稱——新版一開始下載
   就會建出空的 kids-vN，看名字會在還沒換好時就顯示新版號，2026-11-06 就這樣誤判過）。
   新版下載中會收到 sw-progress 廣播，顯示「v17 → v18 下載中 45%」，大人一看就知道要停在首頁等。 */
(function () {
  const tag = document.getElementById('ver');
  if (!('serviceWorker' in navigator)) return;
  let current = '';
  let extra = '';
  const show = () => { tag.textContent = [current, extra].filter(Boolean).join('  '); };
  const ask = (w) => new Promise((resolve) => {
    if (!w || typeof MessageChannel !== 'function') return resolve('');
    const ch = new MessageChannel();
    ch.port1.onmessage = (e) => resolve(String(e.data || ''));
    setTimeout(() => resolve(''), 3000);   // v17 以前的 SW 不會回話
    w.postMessage('version', [ch.port2]);
  });
  // 舊版 SW 不會回話時的退路：有內容的 kids- cache 取最舊的那個——新版下載中會同時有兩個，
  // 正在用的一定是舊的（新版續傳時 cache 裡可能已經有 index.html，不能取最新）
  const fromCaches = () => (window.caches ? caches.keys() : Promise.resolve([]))
    .then((names) => Promise.all(names.filter((n) => n.startsWith('kids-')).map((n) =>
      caches.open(n).then((c) => c.match('index.html')).then((hit) => (hit ? n : '')))))
    .then((ok) => ok.filter(Boolean).sort((a, b) => parseInt(a.slice(6), 10) - parseInt(b.slice(6), 10))[0] || '')
    .then((n) => n.replace('kids-', ''))
    .catch(() => '');
  navigator.serviceWorker.getRegistration().then((reg) => {
    if (!reg) return;
    if (!extra && (reg.installing || reg.waiting)) extra = '更新中…';
    return ask(reg.active).then((v) => v || fromCaches()).then((v) => { current = v; show(); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type !== 'sw-progress' || !d.total || d.version === current) return;
    const pct = Math.floor(d.done * 100 / d.total);
    extra = '→ ' + d.version + ' 下載中 ' + pct + '%';
    show();
    // 大人專區裡的進度條
    document.getElementById('verBarWrap').hidden = false;
    document.getElementById('verBar').style.width = pct + '%';
    document.getElementById('verPct').textContent = pct + '%';
    document.querySelector('#verBarWrap .track').setAttribute('aria-valuenow', String(pct));
  });
  if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
})();
</script>
</body>
</html>

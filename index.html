<!-- 右下角的小版本號：iPad 實機驗證時用來確認主畫面 App 跑的是不是最新快取，不是給小孩看的 -->
<div id="ver" class="ver-tag"></div>

<script src="js/kiosk.js"></script>
<script src="js/music.js"></script>
<script>
/* 註冊 service worker：離線可玩全靠它。失敗（不支援、file:// 開啟、
   權限被擋）就靜默略過，網頁照常運作，只是沒有離線能力。 */
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
  /* 升版後自動換新：sw.js 有 skipWaiting＋clients.claim，新版一裝好就接管，
     但「已經開著的頁面」跑的仍是舊 JS——加入主畫面的 App 不會被關掉，
     結果 iPad 上永遠是舊版（2026-09-03 實機：新加的三處唸英文全部沒聲，重開 App 才好）。
     所以新版 SW 一接管就把首頁重載一次拿新檔。只在首頁做：著色畫到一半被重載會很糟，
     而每次進遊戲都會經過首頁，在這裡換就夠了。sessionStorage 旗標防止連續重載。 */
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    try {
      if (sessionStorage.getItem('swReloaded') === '1') return;
      sessionStorage.setItem('swReloaded', '1');
    } catch (e) { /* 沒有 sessionStorage 也照樣重載一次 */ }
    location.reload();
  });
}
/* 右下角版本號：顯示「正在用的」SW 版本（問 SW 本人，不看 cache 名稱——新版一開始下載
   就會建出空的 kids-vN，看名字會在還沒換好時就顯示新版號，2026-11-06 就這樣誤判過）。
   新版下載中會收到 sw-progress 廣播，顯示「v17 → v18 下載中 45%」，大人一看就知道要停在首頁等。 */
(function () {
  const tag = document.getElementById('ver');
  if (!('serviceWorker' in navigator)) return;
  let current = '';
  let extra = '';
  const show = () => { tag.textContent = [current, extra].filter(Boolean).join('  '); };
  const ask = (w) => new Promise((resolve) => {
    if (!w || typeof MessageChannel !== 'function') return resolve('');
    const ch = new MessageChannel();
    ch.port1.onmessage = (e) => resolve(String(e.data || ''));
    setTimeout(() => resolve(''), 3000);   // v17 以前的 SW 不會回話
    w.postMessage('version', [ch.port2]);
  });
  // 舊版 SW 不會回話時的退路：有內容的 kids- cache 取最舊的那個——新版下載中會同時有兩個，
  // 正在用的一定是舊的（新版續傳時 cache 裡可能已經有 index.html，不能取最新）
  const fromCaches = () => (window.caches ? caches.keys() : Promise.resolve([]))
    .then((names) => Promise.all(names.filter((n) => n.startsWith('kids-')).map((n) =>
      caches.open(n).then((c) => c.match('index.html')).then((hit) => (hit ? n : '')))))
    .then((ok) => ok.filter(Boolean).sort((a, b) => parseInt(a.slice(6), 10) - parseInt(b.slice(6), 10))[0] || '')
    .then((n) => n.replace('kids-', ''))
    .catch(() => '');
  navigator.serviceWorker.getRegistration().then((reg) => {
    if (!reg) return;
    if (!extra && (reg.installing || reg.waiting)) extra = '更新中…';
    return ask(reg.active).then((v) => v || fromCaches()).then((v) => { current = v; show(); });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('message', (e) => {
    const d = e.data || {};
    if (d.type !== 'sw-progress' || !d.total || d.version === current) return;
    extra = '→ ' + d.version + ' 下載中 ' + Math.floor(d.done * 100 / d.total) + '%';
    show();
  });
  if (navigator.serviceWorker.startMessages) navigator.serviceWorker.startMessages();
})();
</script>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="小小遊樂園">
<title>小小遊樂園</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icon-192.png">
<link rel="icon" href="assets/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="home">

<!-- 裝飾大圓：左上黃、右下青，只是背景 -->
<div class="deco deco-1"></div>
<div class="deco deco-2"></div>

<button id="musicBtn" class="icon-btn music-fab" title="背景音樂">🎵</button>

<h1 class="home-title">🌈 小小遊樂園 🌈</h1>

<div class="menu">
  <a class="menu-card puzzle-card" href="puzzle.html">
    <span class="menu-emoji">🧩</span>
    <span class="menu-label">拼圖</span>
  </a>
  <a class="menu-card coloring-card" href="coloring.html">
    <span class="menu-emoji">🎨</span>
    <span class="menu-label">著色</span>
  </a>
  <a class="menu-card words-card" href="words.html">
    <span class="menu-emoji">🔤</span>
    <span class="menu-label">單字</span>
  </a>
  <a class="menu-card stickers-card" href="stickers.html">
    <span class="menu-emoji">🧸</span>
    <span class="menu-label">貼紙</span>
  </a>
</div>

<!-- 右下角的小版本號：iPad 實機驗證時用來確認主畫面 App 跑的是不是最新快取，不是給小孩看的 -->
<div id="ver" class="ver-tag"></div>

<script src="js/kiosk.js"></script>
<script src="js/music.js"></script>
<script>
/* 註冊 service worker：離線可玩全靠它。失敗（不支援、file:// 開啟、
   權限被擋）就靜默略過，網頁照常運作，只是沒有離線能力。 */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
/* 顯示目前生效的快取版本（kids-vN 的 N）。拿不到就留空，不影響任何功能。 */
if (window.caches && caches.keys) {
  caches.keys().then((names) => {
    const k = names.filter((n) => n.startsWith('kids-')).sort().pop();
    if (k) document.getElementById('ver').textContent = k.replace('kids-', '');
  }).catch(() => {});
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>著色 - 小小遊樂園</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/style.css">
</head>
<body class="coloring">

<!-- ===== 選圖畫面：跟拼圖頁用同一套 .pic-grid / .pic-thumb 風格 ===== -->
<main id="selectScreen">
  <header class="bar">
    <a href="index.html" class="icon-btn">🏠</a>
    <span class="spacer"></span>
    <div class="bar-title c-select-title">選一張來著色吧！</div>
    <span class="spacer"></span>
    <!-- 這裡刻意不放 🎵：music.js 只認一顆 #musicBtn，統一放在右側工具列 -->
  </header>
  <div class="c-select-scroll">
    <!-- 我的作品：一列橫向捲動的縮圖，一張都沒有時整區隱藏 -->
    <section id="artworkSection" hidden>
      <div class="art-sec-title">🖼️ 我的作品</div>
      <div id="artworkRow" class="artwork-row"></div>
    </section>
    <!-- 分類頁籤：50 張圖分成動物／公主城堡／水果甜點／大張場景／其他／我的照片 -->
    <div id="catTabs" class="cat-tabs"></div>
    <div id="picGrid" class="pic-grid"></div>
  </div>
</main>

<!-- ===== 遊戲畫面：左邊白色畫布 + 右邊木紋直立工具列 ===== -->
<main id="gameScreen" hidden>

  <div id="svgHolder">
    <div id="artWrap"></div>
  </div>

  <aside id="toolbar">
    <!-- 上方：完成 / 存成圖片 -->
    <div class="tb-row">
      <button id="doneBtn" class="tb-sq tb-green" title="完成">✅</button>
      <button id="saveBtn" class="tb-sq tb-blue" title="存成圖片">📷</button>
    </div>

    <!-- 三顆大圓鈕：工具 / 顏色 / 橡皮擦 -->
    <button id="toolBtn" class="tb-round" title="工具">
      <span class="tb-inner" id="toolBtnIcon">🪣</span>
    </button>

    <button id="stampBtn" class="tb-round" title="蓋章">
      <span class="tb-inner">⭐</span>
    </button>

    <button id="colorBtn" class="tb-round tb-color" title="顏色"></button>

    <button id="eraserBtn" class="tb-round" title="橡皮擦">
      <span class="tb-inner">🧽</span>
    </button>

    <span class="tb-gap"></span>

    <!-- 音樂（id 必須是 musicBtn，js/music.js 會自動接上） -->
    <div class="tb-row">
      <button id="musicBtn" class="tb-sq tb-plain" title="背景音樂">🎵</button>
    </div>

    <!-- 底部：復原 / 全部清除 -->
    <div class="tb-row">
      <button id="undoBtn" class="tb-sq tb-red" title="復原">↩️</button>
      <button id="clearBtn" class="tb-sq tb-yellow" title="全部清除">🗑️</button>
    </div>
  </aside>

  <!-- 彈出面板：工具 -->
  <div id="toolPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="toolList" class="tool-list"></div>
    <div id="toolSizeRow" class="tool-size-row" hidden></div>
  </div>

  <!-- 彈出面板：橡皮擦大小（獨立於畫筆的粗細，不共用 toolSizeRow） -->
  <div id="eraserPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="eraserSizeRow" class="tool-size-row"></div>
  </div>

  <!-- 彈出面板：印章圖案 -->
  <div id="stampPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="stampGrid" class="stamp-grid"></div>
    <div id="stampSizeRow" class="stamp-size-row"></div>
  </div>

  <!-- 彈出面板：色盤（56 色 + 6 種花紋） -->
  <div id="colorPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="colorGrid" class="color-grid"></div>
    <div id="patternRow" class="pattern-row"></div>
  </div>

</main>

<input type="file" id="fileInput" accept="image/*" hidden>

<!-- 作品檢視：點「我的作品」的縮圖打開。刪除要按兩次（小孩會亂按），
     不用 confirm()——standalone 模式的 iPad 上體驗很差 -->
<div id="artOverlay" class="overlay" hidden>
  <img id="artImg" alt="我的作品">
  <div class="overlay-row">
    <button id="artSaveBtn" class="big-btn">📷 存起來</button>
    <button id="artDelBtn" class="big-btn alt">🗑️ 刪除</button>
    <button id="artCloseBtn" class="big-btn plain">關閉</button>
  </div>
  <div id="artConfirm" class="art-confirm" hidden>
    <div class="art-confirm-txt">真的要刪掉嗎？</div>
    <div class="overlay-row">
      <button id="artDelYes" class="big-btn alt">對，刪掉</button>
      <button id="artDelNo" class="big-btn">不要</button>
    </div>
  </div>
</div>

<div id="saveOverlay" class="overlay" hidden>
  <img id="saveImg" alt="著色作品">
  <div class="save-hint">長按圖片就可以存到相簿囉！</div>
  <button id="closeSave" class="big-btn alt">關閉</button>
</div>

<div id="processingOverlay" class="overlay" hidden>
  <div class="win-title" style="font-size:34px;">✏️ 畫稿處理中...</div>
</div>

<script src="js/sound.js"></script>
<script src="js/speech.js"></script>
<script src="js/music.js"></script>
<script src="js/lineart-data.js"></script>
<script src="js/lineart-animals.js"></script>
<script src="js/lineart-fantasy.js"></script>
<script src="js/lineart-food.js"></script>
<script src="js/lineart-scenes.js"></script>
<script src="js/patterns-data.js"></script>
<script src="js/stamps-data.js"></script>
<script src="js/photo-tool.js"></script>
<script src="js/storage.js"></script>
<script src="js/coloring.js"></script>
<script>
/* 註冊 service worker：離線可玩全靠它。失敗（不支援、file:// 開啟、
   權限被擋）就靜默略過，網頁照常運作，只是沒有離線能力。 */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>著色 - 小小遊樂園</title>
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/coloring.css">
</head>
<body class="coloring">

<!-- 每一頁左上都一樣：回家（要按住）、上一層、小熊泡泡。
     著色中這一列會浮在紙的左上角、小熊收起來（css/coloring.css 的 .playing）。
     上一層＝回到上一個畫面：著色中→選圖、作品檢視→關掉。 -->
<header class="top">
  <div class="nav">
    <a href="index.html" class="btn xl home-hold" aria-label="回首頁（按住）"><i data-ic="home"></i></a>
    <button id="backBtn" type="button" class="btn xl" aria-label="上一層" hidden><i data-ic="back"></i></button>
  </div>
  <div id="guide" class="guide" data-guide="選ㄒㄩㄢˇ 一ㄧˋ 張ㄓㄤ 來ㄌㄞˊ 著ㄓㄨㄛˊ 色ㄙㄜˋ"></div>
</header>

<!-- ===== 選圖畫面：左邊是圖（上面一列「我的作品」），右邊的盒子選種類 ===== -->
<main id="selectScreen">
  <div class="pick-scroll">
    <!-- 我的作品：一列橫向捲動的縮圖，一張都沒有時整區隱藏 -->
    <section id="artworkSection" hidden>
      <div class="art-sec-title"><i data-ic="image"></i><span data-zy="我ㄨㄛˇ 的˙ㄉㄜ 作ㄗㄨㄛˋ 品ㄆㄧㄣˇ"></span></div>
      <div id="artworkRow" class="artwork-row"></div>
    </section>
    <div id="picGrid" class="pic-grid"></div>
  </div>
  <!-- 種類：全部／動物／公主城堡／水果甜點／車車／大張場景／其他／我的照片。
       每一顆放一張那一類的線稿小圖，不用讀字（js/coloring.js 的 buildCatTabs） -->
  <aside id="catTabs" class="box cats" aria-label="圖的種類"></aside>
</main>

<!-- ===== 著色中：左邊整塊是紙（平的），右邊的盒子放畫具、顏色、上一步、畫好了 ===== -->
<main id="gameScreen" hidden>

  <div class="paper">
    <div id="svgHolder">
      <div id="artWrap"></div>
    </div>
    <!-- 全部擦掉：紙的右上角一顆小的，要按住一秒（手掌掃到不會整張不見） -->
    <button id="clearBtn" type="button" class="btn sm" aria-label="全部擦掉（按住）" disabled><i data-ic="trash"></i></button>
  </div>

  <aside id="toolbar" class="box">
    <!-- 四種畫具：點一下就換。畫筆／蓋章／橡皮擦拿在手上時再點一次，旁邊跳出它的選項 -->
    <div class="tools" role="group" aria-label="畫具">
      <button id="fillBtn" type="button" class="btn tool" aria-label="倒顏料"><i data-ic="bucket"></i></button>
      <button id="brushBtn" type="button" class="btn tool has-more" aria-label="畫筆（再按一次選筆和粗細）"><i data-ic="brush"></i></button>
      <button id="stampBtn" type="button" class="btn tool has-more" aria-label="蓋章（再按一次選圖案和大小）"><i data-ic="stamp"></i></button>
      <button id="eraserBtn" type="button" class="btn tool has-more" aria-label="橡皮擦（再按一次選大小）"><i data-ic="eraser"></i></button>
    </div>

    <!-- 她在學的 11 個顏色永遠攤開；第 12 格（彩虹）打開完整色盤與花紋 -->
    <div id="swatches" class="swatches" role="group" aria-label="顏色"></div>

    <!-- 盒子最下面永遠是：上一步＋綠色的畫好了 -->
    <div class="box-foot">
      <button id="undoBtn" type="button" class="btn" aria-label="上一步" disabled><i data-ic="undo"></i></button>
      <button id="doneBtn" type="button" class="btn go" aria-label="畫好了" disabled><i data-ic="check"></i></button>
    </div>
  </aside>

  <!-- 彈出面板：畫筆的種類與粗細 -->
  <div id="toolPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="toolList" class="cell-row"></div>
    <div id="toolSizeRow" class="cell-row sub" hidden></div>
  </div>

  <!-- 彈出面板：橡皮擦大小（獨立於畫筆的粗細，不共用 toolSizeRow） -->
  <div id="eraserPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="eraserSizeRow" class="cell-row"></div>
  </div>

  <!-- 彈出面板：印章圖案與大小 -->
  <div id="stampPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="stampGrid" class="stamp-grid"></div>
    <div id="stampSizeRow" class="cell-row sub"></div>
  </div>

  <!-- 彈出面板：完整色盤（56 色 + 6 種花紋） -->
  <div id="colorPanel" class="panel" hidden>
    <span class="panel-arrow"></span>
    <div id="colorGrid" class="color-grid"></div>
    <div id="patternRow" class="pattern-row"></div>
  </div>

</main>

<input type="file" id="fileInput" accept="image/*" hidden>

<canvas id="confettiCanvas"></canvas>

<!-- 完成畫面：她畫的那張是主角；兩個選擇都是圖示（繼續畫這張、換一張） -->
<div id="doneOverlay" class="done" hidden>
  <div class="done-art">
    <span class="done-pic"><img id="donePic" alt="畫好的圖"></span>
    <img class="done-bear" src="assets/stickers/bear.png" alt="">
  </div>
  <div class="done-side">
    <div class="done-title" data-zy="好ㄏㄠˇ 棒ㄅㄤˋ"></div>
    <div class="done-row">
      <button id="keepBtn" type="button" class="btn" aria-label="繼續畫這張"><i data-ic="brush"></i></button>
      <button id="newPicBtn" type="button" class="btn go" aria-label="換一張圖"><i data-ic="grid"></i></button>
    </div>
  </div>
</div>

<!-- 作品檢視：點「我的作品」的縮圖打開，左上的上一層關掉。
     丟掉要按兩次（小孩會亂按）：垃圾桶 →「真的要丟掉嗎」→ ✗／✓。
     不用 confirm()——standalone 模式的 iPad 上體驗很差，她也讀不懂。
     存到相簿會跳出系統的分享選單（全是字），是大人做的事，所以是平的小按鈕。 -->
<div id="artOverlay" class="overlay art-view" hidden>
  <img id="artImg" alt="我的作品">
  <div class="art-side">
    <div id="artActions" class="art-actions">
      <button id="artDelBtn" type="button" class="btn xl" aria-label="丟掉這張"><i data-ic="trash"></i></button>
      <button id="artSaveBtn" type="button" class="adult" aria-label="存到相簿"><i data-ic="download"></i>存到相簿</button>
    </div>
    <div id="artConfirm" class="art-confirm" hidden>
      <div class="art-confirm-txt" data-zy="真ㄓㄣ 的˙ㄉㄜ 要ㄧㄠˋ 丟ㄉㄧㄡ 掉ㄉㄧㄠˋ 嗎˙ㄇㄚ"></div>
      <div class="overlay-row">
        <button id="artDelNo" type="button" class="btn xl" aria-label="不要丟"><i data-ic="close"></i></button>
        <button id="artDelYes" type="button" class="btn xl room" aria-label="對，丟掉"><i data-ic="check"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- 存圖提示：不支援系統分享的瀏覽器才會看到（長按圖片存檔），左上的上一層關掉 -->
<div id="saveOverlay" class="overlay save-view" hidden>
  <img id="saveImg" alt="著色作品">
  <div class="save-hint" data-zy="長ㄔㄤˊ 按ㄢˋ 圖ㄊㄨˊ 片ㄆㄧㄢˋ 存ㄘㄨㄣˊ 到ㄉㄠˋ 相ㄒㄧㄤˋ 簿ㄅㄨˋ"></div>
</div>

<!-- 照片轉線稿要一兩秒：一支在動的鉛筆，告訴她「在準備了」 -->
<div id="processingOverlay" class="overlay busy" hidden>
  <div class="busy-ic"><i data-ic="pencil"></i></div>
  <div class="busy-txt" data-zy="準ㄓㄨㄣˇ 備ㄅㄟˋ 中ㄓㄨㄥ"></div>
</div>

<script src="js/kiosk.js"></script>
<script src="js/sound.js"></script>
<script src="js/speech.js"></script>
<script src="js/music.js"></script>
<script src="js/ui.js"></script>
<script src="js/lineart-data.js"></script>
<script src="js/lineart-animals.js"></script>
<script src="js/lineart-fantasy.js"></script>
<script src="js/lineart-food.js"></script>
<script src="js/lineart-vehicles.js"></script>
<script src="js/lineart-scenes.js"></script>
<script src="js/patterns-data.js"></script>
<script src="js/stamps-data.js"></script>
<script src="js/photo-tool.js"></script>
<script src="js/undo-rect.js"></script>
<script src="js/storage.js"></script>
<script src="js/coloring.js"></script>
<script src="js/book-sync.js"></script>
<script>
/* 註冊 service worker：離線可玩全靠它。失敗（不支援、file:// 開啟、
   權限被擋）就靜默略過，網頁照常運作，只是沒有離線能力。 */
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
